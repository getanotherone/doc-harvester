[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-harvester"
version = "0.2.0"
description = "A configurable ingestion pipeline for technical documents and RAG datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Andrei Galai"}]
keywords = ["scraper", "rag", "pdf", "ocr", "document-processing", "chunking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "beautifulsoup4==4.12.3",
  "openpyxl==3.1.5",
  "pdfminer.six==20231228",
  "requests==2.33.0",
  "tiktoken==0.7.0",
]

[project.optional-dependencies]
ocr = [
  "pdf2image==1.17.0",
  "pytesseract==0.3.10",
]
browser = [
  "playwright==1.58.0",
]
legacy = [
  "pdf2image==1.17.0",
  "pytesseract==0.3.10",
  "playwright==1.58.0",
]
api = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
]
s3 = [
  "boto3>=1.35,<2",
]
wiki = [
  "python-dotenv>=1.0,<2",
]
confluence = [
  "markdown>=3.7,<4",
]
dev = [
  "httpx==0.27.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff>=0.15.0",
]

[project.scripts]
doc-harvester = "doc_harvester.cli:main"

[tool.setuptools]
packages = [
  "doc_harvester",
  "doc_harvester.core",
  "doc_harvester.chunkers",
  "doc_harvester.crawlers",
  "doc_harvester.discovery",
  "doc_harvester.enrichers",
  "doc_harvester.extractors",
  "doc_harvester.fetchers",
  "doc_harvester.publishers",
  "doc_harvester.quality",
  "doc_harvester.storage",
  "api",
  "api.routers",
]
package-dir = {"" = "src", "api" = "api", "api.routers" = "api/routers"}
py-modules = [
  "browser",
  "chunker",
  "extractors",
  "pdf_extractor_v2",
  "quality_eval",
  "scraper",
  "sitemap",
  "yandex",
  "yandex_search",
]
package-data = {api = ["openapi.yaml"]}
