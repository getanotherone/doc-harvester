name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.11"
          cache: false
      - name: Scan Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--all" .

  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      YANDEX_DISK_TOKEN: __test__
      SCRAPPER_API_KEY: test-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,api]'
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          doc-harvester --version
          doc-harvester demo --output /tmp/doc-harvester-demo.json

  docproc:
    runs-on: ubuntu-latest
    env:
      YANDEX_DISK_TOKEN: __test__
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test DocProc pipeline
        env:
          PYTHONPATH: services/doc_proc/backend/src
        run: python -m pytest -q services/doc_proc/tests

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/doc-harvester-wheel
          /tmp/doc-harvester-wheel/bin/python -m pip install dist/*.whl
          /tmp/doc-harvester-wheel/bin/doc-harvester --version
          /tmp/doc-harvester-wheel/bin/doc-harvester demo \
            --output /tmp/doc-harvester-wheel-demo.json
          /tmp/doc-harvester-wheel/bin/python -c \
            "import importlib.util; assert importlib.util.find_spec('playwright') is None"
      - name: Run installed-wheel golden-path smoke
        run: |
          python -m http.server 8765 --bind 127.0.0.1 \
            --directory examples/golden-path/site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8765/ >/dev/null
          /tmp/doc-harvester-wheel/bin/doc-harvester source crawl \
            http://127.0.0.1:8765/ --delay 0 --limit 20 \
            --output /tmp/doc-harvester-wheel-crawl.json
          /tmp/doc-harvester-wheel/bin/doc-harvester source process \
            /tmp/doc-harvester-wheel-crawl.json \
            --output /tmp/doc-harvester-wheel-dataset
          /tmp/doc-harvester-wheel/bin/doc-harvester source inspect \
            /tmp/doc-harvester-wheel-dataset \
            > /tmp/doc-harvester-wheel-inspection.json
          /tmp/doc-harvester-wheel/bin/python -c \
            "import json; p=json.load(open('/tmp/doc-harvester-wheel-inspection.json')); assert p['processed_count'] == 4"
