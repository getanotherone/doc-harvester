name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      YANDEX_DISK_TOKEN: __test__
      SCRAPPER_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,api]'
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          doc-harvester --version
          doc-harvester demo --output /tmp/doc-harvester-demo.json

  docproc:
    runs-on: ubuntu-latest
    env:
      YANDEX_DISK_TOKEN: __test__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test DocProc pipeline
        env:
          PYTHONPATH: services/doc_proc/backend/src
        run: python -m pytest -q services/doc_proc/tests
