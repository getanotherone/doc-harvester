name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          tag = os.environ['RELEASE_TAG'];
          assert tag == f'v{version}', f'release tag {tag!r} does not match v{version}'"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/doc-harvester-release
          /tmp/doc-harvester-release/bin/python -m pip install dist/*.whl
          /tmp/doc-harvester-release/bin/doc-harvester --version
          /tmp/doc-harvester-release/bin/doc-harvester demo \
            --output /tmp/doc-harvester-release-demo.json
      - name: Preserve verified distributions for publishing
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/doc-harvester
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with a short-lived identity token
        uses: pypa/gh-action-pypi-publish@release/v1
