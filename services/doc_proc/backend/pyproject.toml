[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-proc"
version = "0.1.0"
description = "Document Processing Microservice — parsing, chunking, embedding, evaluation for electrical engineering documents"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # Document parsing
    "docling>=2.15.0",
    "docling-core>=2.15.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "chardet>=5.2.0",
    "xlrd>=2.0.1",

    # Tokenization
    "tiktoken>=0.7.0",

    # Embeddings
    "openai>=1.0.0",
    "httpx>=0.28.0",
    "sentence-transformers>=3.3.0",
    "numpy>=1.26.0",

    # Queue & Storage
    "redis[hiredis]>=5.2.0",
    "minio>=7.2.0",

    # Config
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
